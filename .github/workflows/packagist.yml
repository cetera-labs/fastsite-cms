# Сообщает Packagist о новых коммитах и тегах. Вебхуки GitHub из организации cetera-labs
# не доставляются, поэтому без этого новая версия появлялась на Packagist с задержкой.
# Токен — секрет организации PACKAGIST_API_TOKEN (аккаунт cetera на Packagist).
name: Packagist

on:
  push:
    branches: ['**']
    tags: ['**']

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Обновить пакет на Packagist
        env:
          PACKAGIST_API_TOKEN: ${{ secrets.PACKAGIST_API_TOKEN }}
          REPO_URL: https://github.com/${{ github.repository }}
        run: |
          curl -sS --fail-with-body -X POST \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer cetera:${PACKAGIST_API_TOKEN}" \
            -d "{\"repository\":{\"url\":\"${REPO_URL}\"}}" \
            https://packagist.org/api/update-package
