# Локальное окружение для разработки CMS (CCTM-1589).
# Образы публичные, поэтому окружение поднимается и на раннерах CI (CCTM-1603).
# Запуск — через dev/dev.sh или make, см. dev/README.md.
#
# Сайт живёт в томе site (/var/www/site): composer.json, vendor, www, .prefs.
# Код CMS из репозитория подмонтирован в vendor/cetera-labs/cetera-cms,
# а www/cms состоит из симлинков на него — правки видны сразу, без phing.
name: fastsite-cms-dev

x-site-volumes: &site-volumes
  - site:/var/www/site
  - ..:/var/www/site/vendor/cetera-labs/cetera-cms

services:
  db:
    image: percona:8.0
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
      MYSQL_DATABASE: cetera
      MYSQL_USER: cetera
      MYSQL_PASSWORD: cetera
      TZ: Europe/Moscow
    volumes:
      - db:/var/lib/mysql
      - ./mysql/server.cnf:/etc/my.cnf.d/server.cnf:ro
    ports:
      - "127.0.0.1:${DEV_DB_PORT:-53307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ucetera", "-pcetera"]
      interval: 3s
      retries: 40

  php:
    image: fastsite-cms-php:${DEV_PHP_VERSION:-8.4-fpm}
    build:
      context: ./php
      args:
        PHP_VERSION: ${DEV_PHP_VERSION:-8.4-fpm}
    working_dir: /var/www/site
    environment:
      RUN_MODE: development
      TZ: Europe/Moscow
      COMPOSER_ALLOW_SUPERUSER: 1
    volumes: *site-volumes
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.29-alpine
    volumes:
      - site:/var/www/site:ro
      - ..:/var/www/site/vendor/cetera-labs/cetera-cms:ro
      - ./nginx/site.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${DEV_HTTP_PORT:-8090}:80"
    depends_on:
      - php

  # Playwright для e2e-проверок (dev/dev.sh e2e); в обычном up не стартует
  e2e:
    image: mcr.microsoft.com/playwright:v1.58.2-noble
    profiles: [e2e]
    working_dir: /e2e
    environment:
      CMS_TEST_URL: http://nginx
      CI: ${CI:-}
    volumes:
      - ../e2e:/e2e
      - e2e_node_modules:/e2e/node_modules
    depends_on:
      - nginx

  memcached:
    image: memcached

  mailcatcher:
    image: dockage/mailcatcher:0.9.0
    ports:
      - "127.0.0.1:${DEV_MAIL_PORT:-10081}:1080"

volumes:
  site:
  db:
  e2e_node_modules:
