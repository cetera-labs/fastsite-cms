# Конфигурация сайта для публичного образа nginx (локальное окружение и CI).
# Повторяет правила боевого окружения (common/fpm_ceteracms.conf): всё, что не нашлось
# файлом, уходит во фронт-офис cms/fo.php; скрипты плагинов и тем — через plugin_call.php.
# имя php резолвится в момент запроса, поэтому нужен DNS докера: иначе nginx
# не стартует, пока не поднялся php, а после его перезапуска отдаёт 502
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80 default_server;
    server_name _;
    root /var/www/site/www/;
    index index.php;
    absolute_redirect off;
    client_max_body_size 1024M;

    set $php_sock php:9000;
    set $php_admin_value "\n upload_tmp_dir=$document_root/../tmp\n sys_temp_dir=$document_root/../tmp";
    set $php_value "\n default_charset=utf-8\n mbstring.internal_encoding=utf-8";

    rewrite ^/cms/?$ /cms/index.php permanent;

    location / {
        try_files $uri @backend;
    }

    location @backend {
        fastcgi_pass $php_sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/cms/fo.php;
        fastcgi_param SCRIPT_NAME /cms/fo.php;
        fastcgi_param PHP_ADMIN_VALUE $php_admin_value;
        fastcgi_param PHP_VALUE $php_value;
    }

    location ~* ^/(?:(?:cms/)?plugins|themes)/(?:.+)\.php$ {
        fastcgi_pass $php_sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/cms/include/plugin_call.php;
        fastcgi_param SCRIPT_NAME /cms/include/plugin_call.php;
        fastcgi_param PHP_ADMIN_VALUE $php_admin_value;
        fastcgi_param PHP_VALUE $php_value;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass $php_sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PHP_ADMIN_VALUE $php_admin_value;
        fastcgi_param PHP_VALUE $php_value;
    }

    location ~* /\.\./ { deny all; }
    location ~ /\.(?!well-known) { deny all; }
}
